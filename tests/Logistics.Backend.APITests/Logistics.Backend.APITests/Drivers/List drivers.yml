info:
  name: List drivers
  type: http
  seq: 2
  tags:
    - Drivers

http:
  method: GET
  url: "{{baseUrl}}/drivers"
  params:
    - name: pageSize
      value: "25"
      type: query
      description: Maximum number of items to return per page (default 25, max 100).
    - name: pageToken
      value: ""
      type: query
      description: Opaque continuation token returned from a previous list call (`nextPageToken`) to fetch the next page of results.
      disabled: true
    - name: orderBy
      value: ""
      type: query
      description: Sort expression (e.g., `createdAt desc`, `name asc`).
      disabled: true
    - name: status
      value: Active
      type: query
      description: Filter drivers by current availability/employment status.
      disabled: true
    - name: status
      value: Inactive
      type: query
      description: Filter drivers by current availability/employment status.
      disabled: true
    - name: status
      value: OnLeave
      type: query
      description: Filter drivers by current availability/employment status.
      disabled: true
    - name: status
      value: Suspended
      type: query
      description: Filter drivers by current availability/employment status.
      disabled: true
    - name: licenseClass
      value: ClassA
      type: query
      description: Filter drivers by commercial driver's license classification.
      disabled: true
    - name: licenseClass
      value: ClassB
      type: query
      description: Filter drivers by commercial driver's license classification.
      disabled: true
    - name: licenseClass
      value: ClassC
      type: query
      description: Filter drivers by commercial driver's license classification.
      disabled: true
    - name: licenseClass
      value: Standard
      type: query
      description: Filter drivers by commercial driver's license classification.
      disabled: true
    - name: search
      value: ""
      type: query
      description: Case-insensitive free-text filter applied across key identifying fields.
      disabled: true
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: application/json
    - expression: res.body.items
      operator: isArray
    - expression: res.body.totalCount
      operator: gte
      value: "1"
  scripts:
    - type: tests
      code: |-
        const driverListSchema = {
          type: "object",
          required: ["items", "totalCount"],
          properties: {
            items: {
              type: "array",
              items: {
                type: "object",
                required: [
                  "id",
                  "employeeNumber",
                  "firstName",
                  "lastName",
                  "email",
                  "phone",
                  "licenseNumber",
                  "licenseClass",
                  "licenseExpiryDate",
                  "status",
                  "createdAt",
                  "updatedAt"
                ],
                properties: {
                  id: { type: "string", format: "uuid" },
                  employeeNumber: { type: "string", minLength: 2, maxLength: 32 },
                  firstName: { type: "string", minLength: 1, maxLength: 80 },
                  lastName: { type: "string", minLength: 1, maxLength: 80 },
                  email: { type: "string", format: "email", maxLength: 254 },
                  phone: { type: "string", pattern: "^\\+?[1-9]\\d{1,14}$" },
                  licenseNumber: { type: "string", minLength: 4, maxLength: 32 },
                  licenseClass: { type: "string", enum: ["ClassA", "ClassB", "ClassC", "Standard"] },
                  licenseExpiryDate: { type: "string", format: "date" },
                  status: { type: "string", enum: ["Active", "Inactive", "OnLeave", "Suspended"] },
                  createdAt: { type: "string", format: "date-time" },
                  updatedAt: { type: "string", format: "date-time" }
                }
              }
            },
            nextPageToken: { type: ["string", "null"] },
            totalCount: { type: "integer", minimum: 0 }
          }
        };

        test("GET /drivers returns 200 OK with JSON content", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader("content-type")).to.include("application/json");
        });

        test("GET /drivers response conforms to OpenAPI DriverListResponse schema", function () {
          expect(res.getBody()).to.be.json;
          expect(res.getBody()).to.have.jsonSchema(driverListSchema);
        });

        test("GET /drivers includes the registered driver in paginated items", function () {
          const body = res.getBody();
          const expectedId = bru.getVar("driverId") || bru.getEnvVar("driverId");
          expect(body.items.length).to.be.at.least(1);
          expect(body.totalCount).to.be.at.least(body.items.length);
          if (expectedId) {
            const match = body.items.find((d) => d.id === expectedId);
            expect(match, `Expected driver ${expectedId} in list`).to.not.be.undefined;
            expect(match.employeeNumber).to.equal("EMP-10482");
          }
        });

