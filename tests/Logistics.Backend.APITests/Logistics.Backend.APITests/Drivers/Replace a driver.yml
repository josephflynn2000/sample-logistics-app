info:
  name: Replace a driver
  type: http
  seq: 5
  tags:
    - Drivers

http:
  method: PUT
  url: "{{baseUrl}}/drivers/:driverId"
  headers:
    - name: If-Match
      value: "{{driverEtag}}"
      description: Optional entity tag (`ETag`) value for optimistic concurrency control. If the resource has been modified since this `ETag` was issued, the server returns `412 Precondition Failed`.
  params:
    - name: driverId
      value: "{{driverId}}"
      type: path
      description: Unique identifier (UUID) of the driver.
  body:
    type: json
    data: |-
      {
        "employeeNumber": "EMP-10482",
        "firstName": "Elena",
        "lastName": "Rostova",
        "email": "elena.rostova@example.com",
        "phone": "+13125550199",
        "licenseNumber": "R620-2109-8451",
        "licenseClass": "ClassA",
        "licenseExpiryDate": "2029-09-30",
        "status": "Active"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: application/json
    - expression: res.headers['etag']
      operator: isNotEmpty
    - expression: res.body.id
      operator: eq
      value: "{{driverId}}"
    - expression: res.body.phone
      operator: eq
      value: '"+13125550199"'
    - expression: res.body.licenseExpiryDate
      operator: eq
      value: "2029-09-30"
  scripts:
    - type: after-response
      code: |-
        if (res.getHeader("etag")) {
          bru.setVar("driverEtag", res.getHeader("etag"));
        }
    - type: tests
      code: |-
        const driverSchema = {
          type: "object",
          required: [
            "id",
            "employeeNumber",
            "firstName",
            "lastName",
            "email",
            "phone",
            "licenseNumber",
            "licenseClass",
            "licenseExpiryDate",
            "status",
            "createdAt",
            "updatedAt"
          ],
          properties: {
            id: { type: "string", format: "uuid" },
            employeeNumber: { type: "string", minLength: 2, maxLength: 32 },
            firstName: { type: "string", minLength: 1, maxLength: 80 },
            lastName: { type: "string", minLength: 1, maxLength: 80 },
            email: { type: "string", format: "email", maxLength: 254 },
            phone: { type: "string", pattern: "^\\+?[1-9]\\d{1,14}$" },
            licenseNumber: { type: "string", minLength: 4, maxLength: 32 },
            licenseClass: { type: "string", enum: ["ClassA", "ClassB", "ClassC", "Standard"] },
            licenseExpiryDate: { type: "string", format: "date" },
            status: { type: "string", enum: ["Active", "Inactive", "OnLeave", "Suspended"] },
            createdAt: { type: "string", format: "date-time" },
            updatedAt: { type: "string", format: "date-time" }
          }
        };

        test("PUT /drivers/:driverId returns 200 OK with updated ETag header", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader("content-type")).to.include("application/json");
          expect(res.getHeader("etag")).to.be.a("string").and.not.be.empty;
        });

        test("PUT /drivers/:driverId response conforms to OpenAPI Driver schema", function () {
          expect(res.getBody()).to.be.json;
          expect(res.getBody()).to.have.jsonSchema(driverSchema);
        });

        test("PUT /drivers/:driverId replaces driver attributes with updated values", function () {
          const expectedId = bru.getVar("driverId") || bru.getEnvVar("driverId");
          const body = res.getBody();
          expect(body.id).to.equal(expectedId);
          expect(body.phone).to.equal("+13125550199");
          expect(body.licenseExpiryDate).to.equal("2029-09-30");
          expect(body.employeeNumber).to.equal("EMP-10482");
          expect(body.status).to.equal("Active");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

