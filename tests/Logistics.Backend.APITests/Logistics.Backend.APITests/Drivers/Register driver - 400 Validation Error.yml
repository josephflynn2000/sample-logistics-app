info:
  name: Register driver - 400 Validation Error
  type: http
  seq: 8
  tags:
    - Drivers
    - ErrorContract

http:
  method: POST
  url: "{{baseUrl}}/drivers"
  body:
    type: json
    data: |-
      {
        "employeeNumber": "E",
        "firstName": "",
        "lastName": "Rostova",
        "email": "not-an-email",
        "phone": "invalid-phone",
        "licenseNumber": "12",
        "licenseClass": "ClassA",
        "licenseExpiryDate": "not-a-date"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.headers['content-type']
      operator: contains
      value: application/problem+json
    - expression: res.body.status
      operator: eq
      value: "400"
    - expression: res.body.errors
      operator: isJson
  scripts:
    - type: tests
      code: |-
        const problemDetailsSchema = {
          type: "object",
          required: ["type", "title", "status", "errors"],
          properties: {
            type: { type: "string", minLength: 1 },
            title: { type: "string", minLength: 1 },
            status: { type: "integer", const: 400 },
            detail: { type: "string" },
            instance: { type: "string" },
            errors: {
              type: "object"
            }
          }
        };

        test("POST /drivers with invalid payload returns 400 application/problem+json", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getHeader("content-type")).to.include("application/problem+json");
        });

        test("400 response conforms to RFC 9457 ValidationProblemDetails schema", function () {
          expect(res.getBody()).to.be.json;
          expect(res.getBody()).to.have.jsonSchema(problemDetailsSchema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Validates that submitting an invalid driver payload returns `400 Bad Request` with `Content-Type: application/problem+json` and the SmartBear Problem Details Registry `validation-error` type.
