info:
  name: Register duplicate driver - 409 Conflict
  type: http
  seq: 3
  tags:
    - Drivers
    - ErrorContract

http:
  method: POST
  url: "{{baseUrl}}/drivers"
  body:
    type: json
    data: |-
      {
        "employeeNumber": "EMP-10482",
        "firstName": "Elena",
        "lastName": "Rostova",
        "email": "elena.rostova@example.com",
        "phone": "+13125550194",
        "licenseNumber": "R620-2109-8451",
        "licenseClass": "ClassA",
        "licenseExpiryDate": "2028-09-30",
        "status": "Active"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.headers['content-type']
      operator: contains
      value: application/problem+json
    - expression: res.body.status
      operator: eq
      value: "409"
  scripts:
    - type: tests
      code: |-
        const conflictProblemSchema = {
          type: "object",
          required: ["type", "title", "status", "detail"],
          properties: {
            type: { type: "string", minLength: 1 },
            title: { type: "string", minLength: 1 },
            status: { type: "integer", const: 409 },
            detail: { type: "string", minLength: 1 },
            instance: { type: "string" }
          }
        };

        test("POST /drivers with duplicate employeeNumber/licenseNumber returns 409 application/problem+json", function () {
          expect(res.getStatus()).to.equal(409);
          expect(res.getHeader("content-type")).to.include("application/problem+json");
        });

        test("409 response conforms to RFC 9457 ProblemDetails schema", function () {
          expect(res.getBody()).to.be.json;
          expect(res.getBody()).to.have.jsonSchema(conflictProblemSchema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Verifies that attempting to register a driver with an existing `employeeNumber`, `email`, or `licenseNumber` returns `409 Conflict` with `Content-Type: application/problem+json` and the SmartBear Problem Details Registry `already-exists` type.
