info:
  name: Register a new driver
  type: http
  seq: 1
  tags:
    - Drivers

http:
  method: POST
  url: "{{baseUrl}}/drivers"
  headers:
    - name: Idempotency-Key
      value: "{{driverIdempotencyKey}}"
      description: Optional client-generated unique key (e.g., UUID) to guarantee idempotent resource creation across network retries.
  body:
    type: json
    data: |-
      {
        "employeeNumber": "EMP-10482",
        "firstName": "Elena",
        "lastName": "Rostova",
        "email": "elena.rostova@example.com",
        "phone": "+13125550194",
        "licenseNumber": "R620-2109-8451",
        "licenseClass": "ClassA",
        "licenseExpiryDate": "2028-09-30",
        "status": "Active"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.headers['content-type']
      operator: contains
      value: application/json
    - expression: res.headers['location']
      operator: contains
      value: /drivers/
    - expression: res.headers['etag']
      operator: isNotEmpty
    - expression: res.body.id
      operator: isString
    - expression: res.body.employeeNumber
      operator: eq
      value: EMP-10482
    - expression: res.body.licenseClass
      operator: eq
      value: ClassA
    - expression: res.body.status
      operator: eq
      value: Active
  scripts:
    - type: before-request
      code: |-
        const { v4: uuidv4 } = require('uuid');
        bru.setVar("driverIdempotencyKey", uuidv4());
    - type: after-response
      code: |-
        if (res.getStatus() === 201 && res.getBody() && res.getBody().id) {
          bru.setVar("driverId", res.getBody().id);
        }
        if (res.getHeader("etag")) {
          bru.setVar("driverEtag", res.getHeader("etag"));
        }
    - type: tests
      code: |-
        const driverSchema = {
          type: "object",
          required: [
            "id",
            "employeeNumber",
            "firstName",
            "lastName",
            "email",
            "phone",
            "licenseNumber",
            "licenseClass",
            "licenseExpiryDate",
            "status",
            "createdAt",
            "updatedAt"
          ],
          properties: {
            id: { type: "string", format: "uuid" },
            employeeNumber: { type: "string", minLength: 2, maxLength: 32 },
            firstName: { type: "string", minLength: 1, maxLength: 80 },
            lastName: { type: "string", minLength: 1, maxLength: 80 },
            email: { type: "string", format: "email", maxLength: 254 },
            phone: { type: "string", pattern: "^\\+?[1-9]\\d{1,14}$" },
            licenseNumber: { type: "string", minLength: 4, maxLength: 32 },
            licenseClass: { type: "string", enum: ["ClassA", "ClassB", "ClassC", "Standard"] },
            licenseExpiryDate: { type: "string", format: "date" },
            status: { type: "string", enum: ["Active", "Inactive", "OnLeave", "Suspended"] },
            createdAt: { type: "string", format: "date-time" },
            updatedAt: { type: "string", format: "date-time" }
          }
        };

        test("POST /drivers returns 201 Created with Location and ETag headers", function () {
          expect(res.getStatus()).to.equal(201);
          expect(res.getHeader("content-type")).to.include("application/json");
          expect(res.getHeader("location")).to.be.a("string").and.include(`/drivers/${res.getBody().id}`);
          expect(res.getHeader("etag")).to.be.a("string").and.not.be.empty;
        });

        test("POST /drivers response conforms to OpenAPI Driver schema", function () {
          expect(res.getBody()).to.be.json;
          expect(res.getBody()).to.have.jsonSchema(driverSchema);
        });

        test("POST /drivers persists submitted driver attributes accurately", function () {
          const body = res.getBody();
          expect(body.employeeNumber).to.equal("EMP-10482");
          expect(body.firstName).to.equal("Elena");
          expect(body.lastName).to.equal("Rostova");
          expect(body.email).to.equal("elena.rostova@example.com");
          expect(body.phone).to.equal("+13125550194");
          expect(body.licenseNumber).to.equal("R620-2109-8451");
          expect(body.licenseClass).to.equal("ClassA");
          expect(body.licenseExpiryDate).to.equal("2028-09-30");
          expect(body.status).to.equal("Active");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

