info:
  name: Replace ordered waypoints for a route
  type: http
  seq: 8
  tags:
    - Routes

http:
  method: PUT
  url: "{{baseUrl}}/routes/:routeId/waypoints"
  headers:
    - name: If-Match
      value: "{{routeEtag}}"
      description: Optional entity tag (`ETag`) value for optimistic concurrency control. If the resource has been modified since this `ETag` was issued, the server returns `412 Precondition Failed`.
  params:
    - name: routeId
      value: "{{routeId}}"
      type: path
      description: Unique identifier (UUID) of the route.
  body:
    type: json
    data: |-
      {
        "waypoints": [
          {
            "sequenceNumber": 1,
            "label": "O'Hare Regional Hub",
            "address": "10000 W O'Hare Ave, Chicago, IL 60666",
            "latitude": 41.9742,
            "longitude": -87.9073,
            "stopType": "Origin",
            "dwellTimeMinutes": 20
          },
          {
            "sequenceNumber": 2,
            "label": "Midway Freight Consolidation Depot",
            "address": "5700 S Cicero Ave, Chicago, IL 60638",
            "latitude": 41.7868,
            "longitude": -87.7522,
            "stopType": "Pickup",
            "dwellTimeMinutes": 15
          },
          {
            "sequenceNumber": 3,
            "label": "South Loop Fulfillment Center",
            "address": "1600 S State St, Chicago, IL 60616",
            "latitude": 41.8601,
            "longitude": -87.6272,
            "stopType": "Destination",
            "dwellTimeMinutes": 25
          }
        ]
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: application/json
    - expression: res.headers['etag']
      operator: isNotEmpty
    - expression: res.body.routeId
      operator: eq
      value: "{{routeId}}"
    - expression: res.body.waypoints.length
      operator: eq
      value: "3"
  scripts:
    - type: after-response
      code: |-
        if (res.getHeader("etag")) {
          bru.setVar("routeEtag", res.getHeader("etag"));
        }
    - type: tests
      code: |-
        const routeWaypointsResponseSchema = {
          type: "object",
          required: ["routeId", "waypoints"],
          properties: {
            routeId: { type: "string", format: "uuid" },
            waypoints: {
              type: "array",
              minItems: 2,
              items: {
                type: "object",
                required: ["sequenceNumber", "label", "latitude", "longitude", "stopType"],
                properties: {
                  sequenceNumber: { type: "integer", minimum: 1 },
                  label: { type: "string", minLength: 1, maxLength: 120 },
                  address: { type: ["string", "null"], maxLength: 250 },
                  latitude: { type: "number", minimum: -90, maximum: 90 },
                  longitude: { type: "number", minimum: -180, maximum: 180 },
                  stopType: { type: "string", enum: ["Origin", "Pickup", "Delivery", "Waypoint", "Destination"] },
                  dwellTimeMinutes: { type: "integer", minimum: 0 }
                }
              }
            }
          }
        };

        test("PUT /routes/:routeId/waypoints returns 200 OK with updated ETag header", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader("content-type")).to.include("application/json");
          expect(res.getHeader("etag")).to.be.a("string").and.not.be.empty;
        });

        test("PUT /routes/:routeId/waypoints response conforms to OpenAPI RouteWaypointsResponse schema", function () {
          expect(res.getBody()).to.be.json;
          expect(res.getBody()).to.have.jsonSchema(routeWaypointsResponseSchema);
        });

        test("PUT /routes/:routeId/waypoints atomically replaces ordered waypoint sequence", function () {
          const expectedId = bru.getVar("routeId") || bru.getEnvVar("routeId");
          const body = res.getBody();
          expect(body.routeId).to.equal(expectedId);
          expect(body.waypoints).to.have.lengthOf(3);
          expect(body.waypoints[0].sequenceNumber).to.equal(1);
          expect(body.waypoints[0].stopType).to.equal("Origin");
          expect(body.waypoints[1].sequenceNumber).to.equal(2);
          expect(body.waypoints[1].label).to.equal("Midway Freight Consolidation Depot");
          expect(body.waypoints[1].stopType).to.equal("Pickup");
          expect(body.waypoints[2].sequenceNumber).to.equal(3);
          expect(body.waypoints[2].stopType).to.equal("Destination");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

