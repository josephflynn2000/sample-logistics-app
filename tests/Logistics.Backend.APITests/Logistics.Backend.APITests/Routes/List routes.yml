info:
  name: List routes
  type: http
  seq: 2
  tags:
    - Routes

http:
  method: GET
  url: "{{baseUrl}}/routes"
  params:
    - name: pageSize
      value: "25"
      type: query
      description: Maximum number of items to return per page (default 25, max 100).
    - name: pageToken
      value: ""
      type: query
      description: Opaque continuation token returned from a previous list call (`nextPageToken`) to fetch the next page of results.
      disabled: true
    - name: orderBy
      value: ""
      type: query
      description: Sort expression (e.g., `createdAt desc`, `name asc`).
      disabled: true
    - name: status
      value: Draft
      type: query
      description: Filter routes by lifecycle status.
      disabled: true
    - name: status
      value: Active
      type: query
      description: Filter routes by lifecycle status.
      disabled: true
    - name: status
      value: Archived
      type: query
      description: Filter routes by lifecycle status.
      disabled: true
    - name: search
      value: ""
      type: query
      description: Case-insensitive free-text filter applied across key identifying fields.
      disabled: true
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: application/json
    - expression: res.body.items
      operator: isArray
    - expression: res.body.totalCount
      operator: gte
      value: "1"
  scripts:
    - type: tests
      code: |-
        const waypointSchema = {
          type: "object",
          required: ["sequenceNumber", "label", "latitude", "longitude", "stopType"],
          properties: {
            sequenceNumber: { type: "integer", minimum: 1 },
            label: { type: "string", minLength: 1, maxLength: 120 },
            address: { type: ["string", "null"], maxLength: 250 },
            latitude: { type: "number", minimum: -90, maximum: 90 },
            longitude: { type: "number", minimum: -180, maximum: 180 },
            stopType: { type: "string", enum: ["Origin", "Pickup", "Delivery", "Waypoint", "Destination"] },
            dwellTimeMinutes: { type: "integer", minimum: 0 }
          }
        };

        const routeListSchema = {
          type: "object",
          required: ["items", "totalCount"],
          properties: {
            items: {
              type: "array",
              items: {
                type: "object",
                required: ["id", "code", "name", "status", "waypoints", "createdAt", "updatedAt"],
                properties: {
                  id: { type: "string", format: "uuid" },
                  code: { type: "string", minLength: 2, maxLength: 32, pattern: "^[A-Z0-9-]+$" },
                  name: { type: "string", minLength: 1, maxLength: 120 },
                  description: { type: ["string", "null"], maxLength: 500 },
                  status: { type: "string", enum: ["Draft", "Active", "Archived"] },
                  estimatedDistanceKm: { type: ["number", "null"], minimum: 0 },
                  estimatedDurationMinutes: { type: ["integer", "null"], minimum: 0 },
                  waypoints: { type: "array", minItems: 2, items: waypointSchema },
                  createdAt: { type: "string", format: "date-time" },
                  updatedAt: { type: "string", format: "date-time" }
                }
              }
            },
            nextPageToken: { type: ["string", "null"] },
            totalCount: { type: "integer", minimum: 0 }
          }
        };

        test("GET /routes returns 200 OK with JSON content", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader("content-type")).to.include("application/json");
        });

        test("GET /routes response conforms to OpenAPI RouteListResponse schema", function () {
          expect(res.getBody()).to.be.json;
          expect(res.getBody()).to.have.jsonSchema(routeListSchema);
        });

        test("GET /routes includes the created route in paginated items", function () {
          const body = res.getBody();
          const expectedId = bru.getVar("routeId") || bru.getEnvVar("routeId");
          expect(body.items.length).to.be.at.least(1);
          expect(body.totalCount).to.be.at.least(body.items.length);
          if (expectedId) {
            const match = body.items.find((r) => r.id === expectedId);
            expect(match, `Expected route ${expectedId} in list`).to.not.be.undefined;
            expect(match.code).to.equal("RTE-MW-101");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

