info:
  name: Replace a route
  type: http
  seq: 5
  tags:
    - Routes

http:
  method: PUT
  url: "{{baseUrl}}/routes/:routeId"
  headers:
    - name: If-Match
      value: "{{routeEtag}}"
      description: Optional entity tag (`ETag`) value for optimistic concurrency control. If the resource has been modified since this `ETag` was issued, the server returns `412 Precondition Failed`.
  params:
    - name: routeId
      value: "{{routeId}}"
      type: path
      description: Unique identifier (UUID) of the route.
  body:
    type: json
    data: |-
      {
        "code": "RTE-MW-101",
        "name": "Chicago O'Hare to Downtown Distribution Loop",
        "description": "Updated morning freight corridor.",
        "status": "Active",
        "estimatedDistanceKm": 36.2,
        "estimatedDurationMinutes": 60,
        "waypoints": [
          {
            "sequenceNumber": 1,
            "label": "O'Hare Regional Hub",
            "address": "10000 W O'Hare Ave, Chicago, IL 60666",
            "latitude": 41.9742,
            "longitude": -87.9073,
            "stopType": "Origin",
            "dwellTimeMinutes": 20
          },
          {
            "sequenceNumber": 2,
            "label": "South Loop Fulfillment Center",
            "address": "1600 S State St, Chicago, IL 60616",
            "latitude": 41.8601,
            "longitude": -87.6272,
            "stopType": "Destination",
            "dwellTimeMinutes": 25
          }
        ]
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: application/json
    - expression: res.headers['etag']
      operator: isNotEmpty
    - expression: res.body.id
      operator: eq
      value: "{{routeId}}"
    - expression: res.body.estimatedDistanceKm
      operator: eq
      value: "36.2"
    - expression: res.body.waypoints.length
      operator: eq
      value: "2"
  scripts:
    - type: after-response
      code: |-
        if (res.getHeader("etag")) {
          bru.setVar("routeEtag", res.getHeader("etag"));
        }
    - type: tests
      code: |-
        const waypointSchema = {
          type: "object",
          required: ["sequenceNumber", "label", "latitude", "longitude", "stopType"],
          properties: {
            sequenceNumber: { type: "integer", minimum: 1 },
            label: { type: "string", minLength: 1, maxLength: 120 },
            address: { type: ["string", "null"], maxLength: 250 },
            latitude: { type: "number", minimum: -90, maximum: 90 },
            longitude: { type: "number", minimum: -180, maximum: 180 },
            stopType: { type: "string", enum: ["Origin", "Pickup", "Delivery", "Waypoint", "Destination"] },
            dwellTimeMinutes: { type: "integer", minimum: 0 }
          }
        };

        const routeSchema = {
          type: "object",
          required: ["id", "code", "name", "status", "waypoints", "createdAt", "updatedAt"],
          properties: {
            id: { type: "string", format: "uuid" },
            code: { type: "string", minLength: 2, maxLength: 32, pattern: "^[A-Z0-9-]+$" },
            name: { type: "string", minLength: 1, maxLength: 120 },
            description: { type: ["string", "null"], maxLength: 500 },
            status: { type: "string", enum: ["Draft", "Active", "Archived"] },
            estimatedDistanceKm: { type: ["number", "null"], minimum: 0 },
            estimatedDurationMinutes: { type: ["integer", "null"], minimum: 0 },
            waypoints: { type: "array", minItems: 2, items: waypointSchema },
            createdAt: { type: "string", format: "date-time" },
            updatedAt: { type: "string", format: "date-time" }
          }
        };

        test("PUT /routes/:routeId returns 200 OK with updated ETag header", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader("content-type")).to.include("application/json");
          expect(res.getHeader("etag")).to.be.a("string").and.not.be.empty;
        });

        test("PUT /routes/:routeId response conforms to OpenAPI Route schema", function () {
          expect(res.getBody()).to.be.json;
          expect(res.getBody()).to.have.jsonSchema(routeSchema);
        });

        test("PUT /routes/:routeId replaces route metadata and embedded waypoints", function () {
          const expectedId = bru.getVar("routeId") || bru.getEnvVar("routeId");
          const body = res.getBody();
          expect(body.id).to.equal(expectedId);
          expect(body.description).to.equal("Updated morning freight corridor.");
          expect(body.estimatedDistanceKm).to.equal(36.2);
          expect(body.estimatedDurationMinutes).to.equal(60);
          expect(body.waypoints).to.have.lengthOf(2);
          expect(body.waypoints[0].sequenceNumber).to.equal(1);
          expect(body.waypoints[1].sequenceNumber).to.equal(2);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

