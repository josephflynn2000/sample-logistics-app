info:
  name: Create route - 400 Validation Error
  type: http
  seq: 10
  tags:
    - Routes
    - ErrorContract

http:
  method: POST
  url: "{{baseUrl}}/routes"
  body:
    type: json
    data: |-
      {
        "code": "invalid code!",
        "name": "",
        "waypoints": [
          {
            "sequenceNumber": 1,
            "label": "Only One Stop",
            "latitude": 120.0,
            "longitude": -200.0,
            "stopType": "Origin"
          }
        ]
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.headers['content-type']
      operator: contains
      value: application/problem+json
    - expression: res.body.status
      operator: eq
      value: "400"
    - expression: res.body.errors
      operator: isJson
  scripts:
    - type: tests
      code: |-
        const problemDetailsSchema = {
          type: "object",
          required: ["type", "title", "status", "errors"],
          properties: {
            type: { type: "string", minLength: 1 },
            title: { type: "string", minLength: 1 },
            status: { type: "integer", const: 400 },
            detail: { type: "string" },
            instance: { type: "string" },
            errors: {
              type: "object"
            }
          }
        };

        test("POST /routes with fewer than 2 waypoints or invalid coordinates returns 400 application/problem+json", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getHeader("content-type")).to.include("application/problem+json");
        });

        test("400 response conforms to RFC 9457 ValidationProblemDetails schema", function () {
          expect(res.getBody()).to.be.json;
          expect(res.getBody()).to.have.jsonSchema(problemDetailsSchema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Validates that creating a route with fewer than 2 waypoints or out-of-range WGS84 coordinates returns `400 Bad Request` with `Content-Type: application/problem+json` and the SmartBear Problem Details Registry `validation-error` type.
