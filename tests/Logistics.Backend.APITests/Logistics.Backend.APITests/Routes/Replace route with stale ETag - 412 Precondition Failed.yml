info:
  name: Replace route with stale ETag - 412 Precondition Failed
  type: http
  seq: 9
  tags:
    - Routes
    - ErrorContract

http:
  method: PUT
  url: "{{baseUrl}}/routes/:routeId"
  headers:
    - name: If-Match
      value: '"stale-etag-00000000"'
      description: Stale entity tag (`ETag`) value to verify optimistic concurrency failure (`412 Precondition Failed`).
  params:
    - name: routeId
      value: "{{routeId}}"
      type: path
      description: Unique identifier (UUID) of the route.
  body:
    type: json
    data: |-
      {
        "code": "RTE-MW-101",
        "name": "Chicago O'Hare to Downtown Distribution Loop",
        "description": "Stale ETag update attempt.",
        "status": "Active",
        "estimatedDistanceKm": 36.2,
        "estimatedDurationMinutes": 60,
        "waypoints": [
          {
            "sequenceNumber": 1,
            "label": "O'Hare Regional Hub",
            "address": "10000 W O'Hare Ave, Chicago, IL 60666",
            "latitude": 41.9742,
            "longitude": -87.9073,
            "stopType": "Origin",
            "dwellTimeMinutes": 20
          },
          {
            "sequenceNumber": 2,
            "label": "South Loop Fulfillment Center",
            "address": "1600 S State St, Chicago, IL 60616",
            "latitude": 41.8601,
            "longitude": -87.6272,
            "stopType": "Destination",
            "dwellTimeMinutes": 25
          }
        ]
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "412"
    - expression: res.headers['content-type']
      operator: contains
      value: application/problem+json
    - expression: res.body.status
      operator: eq
      value: "412"
  scripts:
    - type: tests
      code: |-
        const preconditionProblemSchema = {
          type: "object",
          required: ["type", "title", "status", "detail"],
          properties: {
            type: { type: "string", minLength: 1 },
            title: { type: "string", minLength: 1 },
            status: { type: "integer", const: 412 },
            detail: { type: "string", minLength: 1 },
            instance: { type: "string" }
          }
        };

        test("PUT /routes/:routeId with mismatched If-Match returns 412 application/problem+json", function () {
          expect(res.getStatus()).to.equal(412);
          expect(res.getHeader("content-type")).to.include("application/problem+json");
        });

        test("412 response conforms to RFC 9457 ProblemDetails schema", function () {
          expect(res.getBody()).to.be.json;
          expect(res.getBody()).to.have.jsonSchema(preconditionProblemSchema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Verifies that supplying a stale `If-Match` header when updating a route returns `412 Precondition Failed` with `Content-Type: application/problem+json` and the SmartBear Problem Details Registry `business-rule-violation` type.
