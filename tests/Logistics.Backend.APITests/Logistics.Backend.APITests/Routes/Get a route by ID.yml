info:
  name: Get a route by ID
  type: http
  seq: 4
  tags:
    - Routes

http:
  method: GET
  url: "{{baseUrl}}/routes/:routeId"
  params:
    - name: routeId
      value: "{{routeId}}"
      type: path
      description: Unique identifier (UUID) of the route.
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: application/json
    - expression: res.headers['etag']
      operator: isNotEmpty
    - expression: res.body.id
      operator: eq
      value: "{{routeId}}"
    - expression: res.body.code
      operator: eq
      value: RTE-MW-101
    - expression: res.body.waypoints
      operator: isArray
  scripts:
    - type: after-response
      code: |-
        if (res.getHeader("etag")) {
          bru.setVar("routeEtag", res.getHeader("etag"));
        }
    - type: tests
      code: |-
        const waypointSchema = {
          type: "object",
          required: ["sequenceNumber", "label", "latitude", "longitude", "stopType"],
          properties: {
            sequenceNumber: { type: "integer", minimum: 1 },
            label: { type: "string", minLength: 1, maxLength: 120 },
            address: { type: ["string", "null"], maxLength: 250 },
            latitude: { type: "number", minimum: -90, maximum: 90 },
            longitude: { type: "number", minimum: -180, maximum: 180 },
            stopType: { type: "string", enum: ["Origin", "Pickup", "Delivery", "Waypoint", "Destination"] },
            dwellTimeMinutes: { type: "integer", minimum: 0 }
          }
        };

        const routeSchema = {
          type: "object",
          required: ["id", "code", "name", "status", "waypoints", "createdAt", "updatedAt"],
          properties: {
            id: { type: "string", format: "uuid" },
            code: { type: "string", minLength: 2, maxLength: 32, pattern: "^[A-Z0-9-]+$" },
            name: { type: "string", minLength: 1, maxLength: 120 },
            description: { type: ["string", "null"], maxLength: 500 },
            status: { type: "string", enum: ["Draft", "Active", "Archived"] },
            estimatedDistanceKm: { type: ["number", "null"], minimum: 0 },
            estimatedDurationMinutes: { type: ["integer", "null"], minimum: 0 },
            waypoints: { type: "array", minItems: 2, items: waypointSchema },
            createdAt: { type: "string", format: "date-time" },
            updatedAt: { type: "string", format: "date-time" }
          }
        };

        test("GET /routes/:routeId returns 200 OK with ETag header", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader("content-type")).to.include("application/json");
          expect(res.getHeader("etag")).to.be.a("string").and.not.be.empty;
        });

        test("GET /routes/:routeId response conforms to OpenAPI Route schema", function () {
          expect(res.getBody()).to.be.json;
          expect(res.getBody()).to.have.jsonSchema(routeSchema);
        });

        test("GET /routes/:routeId returns route details and ordered waypoints", function () {
          const expectedId = bru.getVar("routeId") || bru.getEnvVar("routeId");
          const body = res.getBody();
          expect(body.id).to.equal(expectedId);
          expect(body.code).to.equal("RTE-MW-101");
          expect(body.waypoints.length).to.be.at.least(2);
          body.waypoints.forEach((wp, idx) => {
            expect(wp.sequenceNumber).to.equal(idx + 1);
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Route details retrieved successfully.
    request:
      url: "{{baseUrl}}/routes/:routeId"
      method: GET
      params:
        - name: routeId
          value: ""
          type: path
          description: Unique identifier (UUID) of the route.
