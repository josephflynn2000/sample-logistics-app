info:
  name: Partially update a vehicle
  type: http
  seq: 6
  tags:
    - Vehicles

http:
  method: PATCH
  url: "{{baseUrl}}/vehicles/:vehicleId"
  headers:
    - name: Content-Type
      value: application/merge-patch+json
    - name: If-Match
      value: "{{vehicleEtag}}"
      description: Optional entity tag (`ETag`) value for optimistic concurrency control. If the resource has been modified since this `ETag` was issued, the server returns `412 Precondition Failed`.
  params:
    - name: vehicleId
      value: "{{vehicleId}}"
      type: path
      description: Unique identifier (UUID) of the vehicle.
  body:
    type: json
    data: |-
      {
        "status": "InMaintenance"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: application/json
    - expression: res.headers['etag']
      operator: isNotEmpty
    - expression: res.body.id
      operator: eq
      value: "{{vehicleId}}"
    - expression: res.body.status
      operator: eq
      value: InMaintenance
  scripts:
    - type: after-response
      code: |-
        if (res.getHeader("etag")) {
          bru.setVar("vehicleEtag", res.getHeader("etag"));
        }
    - type: tests
      code: |-
        const vehicleSchema = {
          type: "object",
          required: [
            "id",
            "vin",
            "licensePlate",
            "make",
            "model",
            "year",
            "type",
            "capacityKg",
            "capacityVolumeM3",
            "status",
            "createdAt",
            "updatedAt"
          ],
          properties: {
            id: { type: "string", format: "uuid" },
            vin: { type: "string", minLength: 17, maxLength: 17, pattern: "^[A-HJ-NPR-Z0-9]{17}$" },
            licensePlate: { type: "string", minLength: 2, maxLength: 20 },
            make: { type: "string", minLength: 1, maxLength: 60 },
            model: { type: "string", minLength: 1, maxLength: 60 },
            year: { type: "integer", minimum: 1990, maximum: 2100 },
            type: { type: "string", enum: ["Van", "BoxTruck", "SemiTractor", "RefrigeratedTruck", "Flatbed"] },
            capacityKg: { type: "number", minimum: 1 },
            capacityVolumeM3: { type: "number", minimum: 0.1 },
            status: { type: "string", enum: ["Available", "InMaintenance", "OutOfService", "Retired"] },
            createdAt: { type: "string", format: "date-time" },
            updatedAt: { type: "string", format: "date-time" }
          }
        };

        test("PATCH /vehicles/:vehicleId returns 200 OK with ETag header", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getHeader("content-type")).to.include("application/json");
          expect(res.getHeader("etag")).to.be.a("string").and.not.be.empty;
        });

        test("PATCH /vehicles/:vehicleId response conforms to OpenAPI Vehicle schema", function () {
          expect(res.getBody()).to.be.json;
          expect(res.getBody()).to.have.jsonSchema(vehicleSchema);
        });

        test("PATCH /vehicles/:vehicleId updates status while preserving other fields", function () {
          const expectedId = bru.getVar("vehicleId") || bru.getEnvVar("vehicleId");
          const body = res.getBody();
          expect(body.id).to.equal(expectedId);
          expect(body.status).to.equal("InMaintenance");
          expect(body.vin).to.equal("1FUJGHDV0CLBP8899");
          expect(body.capacityKg).to.equal(18500);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

