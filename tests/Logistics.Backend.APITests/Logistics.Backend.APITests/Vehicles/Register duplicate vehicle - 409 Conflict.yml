info:
  name: Register duplicate vehicle - 409 Conflict
  type: http
  seq: 3
  tags:
    - Vehicles
    - ErrorContract

http:
  method: POST
  url: "{{baseUrl}}/vehicles"
  body:
    type: json
    data: |-
      {
        "vin": "1FUJGHDV0CLBP8899",
        "licensePlate": "IL-LOG-4021",
        "make": "Freightliner",
        "model": "Cascadia",
        "year": 2024,
        "type": "SemiTractor",
        "capacityKg": 18000,
        "capacityVolumeM3": 85.5,
        "status": "Available"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"
    - expression: res.headers['content-type']
      operator: contains
      value: application/problem+json
    - expression: res.body.status
      operator: eq
      value: "409"
  scripts:
    - type: tests
      code: |-
        const conflictProblemSchema = {
          type: "object",
          required: ["type", "title", "status", "detail"],
          properties: {
            type: { type: "string", minLength: 1 },
            title: { type: "string", minLength: 1 },
            status: { type: "integer", const: 409 },
            detail: { type: "string", minLength: 1 },
            instance: { type: "string" }
          }
        };

        test("POST /vehicles with duplicate VIN/licensePlate returns 409 application/problem+json", function () {
          expect(res.getStatus()).to.equal(409);
          expect(res.getHeader("content-type")).to.include("application/problem+json");
        });

        test("409 response conforms to RFC 9457 ProblemDetails schema", function () {
          expect(res.getBody()).to.be.json;
          expect(res.getBody()).to.have.jsonSchema(conflictProblemSchema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Verifies that attempting to register a vehicle with an existing unique VIN or license plate returns `409 Conflict` with `Content-Type: application/problem+json` and the SmartBear Problem Details Registry `already-exists` type.
