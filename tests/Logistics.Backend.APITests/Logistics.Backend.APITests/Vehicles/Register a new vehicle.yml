info:
  name: Register a new vehicle
  type: http
  seq: 1
  tags:
    - Vehicles

http:
  method: POST
  url: "{{baseUrl}}/vehicles"
  headers:
    - name: Idempotency-Key
      value: "{{vehicleIdempotencyKey}}"
      description: Optional client-generated unique key (e.g., UUID) to guarantee idempotent resource creation across network retries.
  body:
    type: json
    data: |-
      {
        "vin": "1FUJGHDV0CLBP8899",
        "licensePlate": "IL-LOG-4021",
        "make": "Freightliner",
        "model": "Cascadia",
        "year": 2024,
        "type": "SemiTractor",
        "capacityKg": 18000,
        "capacityVolumeM3": 85.5,
        "status": "Available"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.headers['content-type']
      operator: contains
      value: application/json
    - expression: res.headers['location']
      operator: contains
      value: /vehicles/
    - expression: res.headers['etag']
      operator: isNotEmpty
    - expression: res.body.id
      operator: isString
    - expression: res.body.vin
      operator: eq
      value: 1FUJGHDV0CLBP8899
    - expression: res.body.licensePlate
      operator: eq
      value: IL-LOG-4021
    - expression: res.body.status
      operator: eq
      value: Available
  scripts:
    - type: before-request
      code: |-
        const { v4: uuidv4 } = require('uuid');
        bru.setVar("vehicleIdempotencyKey", uuidv4());
    - type: after-response
      code: |-
        if (res.getStatus() === 201 && res.getBody() && res.getBody().id) {
          bru.setVar("vehicleId", res.getBody().id);
        }
        if (res.getHeader("etag")) {
          bru.setVar("vehicleEtag", res.getHeader("etag"));
        }
    - type: tests
      code: |-
        const vehicleSchema = {
          type: "object",
          required: [
            "id",
            "vin",
            "licensePlate",
            "make",
            "model",
            "year",
            "type",
            "capacityKg",
            "capacityVolumeM3",
            "status",
            "createdAt",
            "updatedAt"
          ],
          properties: {
            id: { type: "string", format: "uuid" },
            vin: { type: "string", minLength: 17, maxLength: 17, pattern: "^[A-HJ-NPR-Z0-9]{17}$" },
            licensePlate: { type: "string", minLength: 2, maxLength: 20 },
            make: { type: "string", minLength: 1, maxLength: 60 },
            model: { type: "string", minLength: 1, maxLength: 60 },
            year: { type: "integer", minimum: 1990, maximum: 2100 },
            type: { type: "string", enum: ["Van", "BoxTruck", "SemiTractor", "RefrigeratedTruck", "Flatbed"] },
            capacityKg: { type: "number", minimum: 1 },
            capacityVolumeM3: { type: "number", minimum: 0.1 },
            status: { type: "string", enum: ["Available", "InMaintenance", "OutOfService", "Retired"] },
            createdAt: { type: "string", format: "date-time" },
            updatedAt: { type: "string", format: "date-time" }
          }
        };

        test("POST /vehicles returns 201 Created with Location and ETag headers", function () {
          expect(res.getStatus()).to.equal(201);
          expect(res.getHeader("content-type")).to.include("application/json");
          expect(res.getHeader("location")).to.be.a("string").and.include(`/vehicles/${res.getBody().id}`);
          expect(res.getHeader("etag")).to.be.a("string").and.not.be.empty;
        });

        test("POST /vehicles response conforms to OpenAPI Vehicle schema", function () {
          expect(res.getBody()).to.be.json;
          expect(res.getBody()).to.have.jsonSchema(vehicleSchema);
        });

        test("POST /vehicles persists submitted payload fields accurately", function () {
          const body = res.getBody();
          expect(body.vin).to.equal("1FUJGHDV0CLBP8899");
          expect(body.licensePlate).to.equal("IL-LOG-4021");
          expect(body.make).to.equal("Freightliner");
          expect(body.model).to.equal("Cascadia");
          expect(body.year).to.equal(2024);
          expect(body.type).to.equal("SemiTractor");
          expect(body.capacityKg).to.equal(18000);
          expect(body.capacityVolumeM3).to.equal(85.5);
          expect(body.status).to.equal("Available");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    description: Vehicle successfully registered.
    request:
      url: "{{baseUrl}}/vehicles"
      method: POST
      headers:
        - name: Idempotency-Key
          value: ""
          description: Optional client-generated unique key (e.g., UUID) to guarantee idempotent resource creation across network retries.
          disabled: true
      body:
        type: json
        data: |-
          {
            "vin": "1FUJGHDV0CLBP8899",
            "licensePlate": "IL-LOG-4021",
