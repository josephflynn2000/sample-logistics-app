info:
  name: Register vehicle - 400 Validation Error
  type: http
  seq: 8
  tags:
    - Vehicles
    - ErrorContract

http:
  method: POST
  url: "{{baseUrl}}/vehicles"
  body:
    type: json
    data: |-
      {
        "vin": "INVALID-VIN",
        "licensePlate": "A",
        "make": "",
        "model": "Cascadia",
        "year": 1980,
        "type": "SemiTractor",
        "capacityKg": -50,
        "capacityVolumeM3": 0
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.headers['content-type']
      operator: contains
      value: application/problem+json
    - expression: res.body.type
      operator: eq
      value: https://problems-registry.smartbear.com/validation-error/
    - expression: res.body.status
      operator: eq
      value: "400"
    - expression: res.body.errors
      operator: isArray
  scripts:
    - type: tests
      code: |-
        const problemDetailsSchema = {
          type: "object",
          required: ["type", "title", "status", "detail", "errors"],
          properties: {
            type: { type: "string", const: "https://problems-registry.smartbear.com/validation-error/" },
            title: { type: "string", minLength: 1 },
            status: { type: "integer", const: 400 },
            detail: { type: "string", minLength: 1 },
            instance: { type: "string" },
            code: { type: "string" },
            errors: {
              type: "array",
              minItems: 1,
              items: {
                type: "object",
                required: ["detail"],
                properties: {
                  detail: { type: "string", minLength: 1 },
                  pointer: { type: "string" },
                  parameter: { type: "string" }
                }
              }
            }
          }
        };

        test("POST /vehicles with invalid payload returns 400 application/problem+json", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getHeader("content-type")).to.include("application/problem+json");
        });

        test("400 response conforms to RFC 9457 ProblemDetails validation-error schema", function () {
          expect(res.getBody()).to.be.json;
          expect(res.getBody()).to.have.jsonSchema(problemDetailsSchema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Validates that submitting an invalid vehicle payload returns `400 Bad Request` with `Content-Type: application/problem+json` and the SmartBear Problem Details Registry `validation-error` type.
